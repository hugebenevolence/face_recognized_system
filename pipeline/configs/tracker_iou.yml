%YAML:1.0
# IOU tracker: gives every face a stable id so recognition runs once per person, not per frame.
BaseConfig:
  minDetectorConfidence: 0
TargetManagement:
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 50
  minIouDiff4NewTarget: 0.5
  probationAge: 3
  maxShadowTrackingAge: 20
  earlyTerminationAge: 1
TrajectoryManagement:
  useUniqueID: 0
DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 0
  checkClassMatch: 1
  minMatchingScore4Overall: 0.0
  minMatchingScore4SizeSimilarity: 0.0
  minMatchingScore4Iou: 0.2
  matchingScoreWeight4SizeSimilarity: 0.4
  matchingScoreWeight4Iou: 0.6
