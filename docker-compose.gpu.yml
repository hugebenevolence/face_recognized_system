# Optional: run the still-image (registration) service on the GPU too.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# The live pipeline always uses the GPU. Both services use the same buffalo_l model pack,
# so embeddings from registration and from live video are directly comparable.
services:
  enroll:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
        ORT_PACKAGE: onnxruntime-gpu
    environment:
      ORT_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
