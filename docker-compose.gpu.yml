# GPU override (NVIDIA Container Toolkit / Docker Desktop + WSL2 required).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# The GPU profile defaults to the larger, more accurate buffalo_l; the CPU profile
# (docker-compose.yml alone) defaults to buffalo_s, which is ~5x faster on CPU.
# Embeddings of different model packs are not comparable: after switching, open
# Faces -> "Update" (or POST /api/admin/reanalyze) to embed the stored photos again.
services:
  pipeline:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
        ORT_PACKAGE: onnxruntime-gpu
        MODEL_PACK: ${MODEL_PACK:-buffalo_l}
    environment:
      ORT_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
      MODEL_PACK: ${MODEL_PACK:-buffalo_l}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
