# Face Recognition stack. The live pipeline runs on DeepStream, so an NVIDIA GPU is required.
#   docker compose up --build
#   + simulated RTSP camera from ./samples/demo.mp4 :  add  --profile sim
#   + registration on the GPU as well :  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
name: face-recognition

x-service-env: &service-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-face}:${POSTGRES_PASSWORD:-face}@db:5432/${POSTGRES_DB:-face}
  BACKEND_URL: http://backend:8000
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
  DATA_DIR: /data
  CAMERA_ID: ${CAMERA_ID:-cam1}
  MODEL_PACK: buffalo_l
  MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.40}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-face}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face}
      POSTGRES_DB: ${POSTGRES_DB:-face}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-face}:${POSTGRES_PASSWORD:-face}@db:5432/${POSTGRES_DB:-face}
      PIPELINE_URL: http://pipeline:8090
      ENROLL_URL: http://enroll:8090
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CAMERA_ID: ${CAMERA_ID:-cam1}
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Live recognition: one DeepStream graph (decode, SCRFD, tracker, ArcFace, OSD, JPEG encode).
  pipeline:
    build: ./pipeline
    environment:
      <<: *service-env
      SOURCE_URI: ${SOURCE_URI:-rtsp://mediamtx:8554/cam1}
      RTSP_OUT_URL: ${RTSP_OUT_URL:-}
    volumes:
      - appdata:/data
      - models:/models
      - ./samples:/samples:ro
    ports:
      - "8090:8090"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Still images: embeddings for registration, group photos and explanations. CPU is enough.
  enroll:
    build:
      context: ./enroll
      args:
        BASE_IMAGE: ${ENROLL_BASE_IMAGE:-ubuntu:22.04}
        ORT_PACKAGE: ${ORT_PACKAGE:-onnxruntime}
        MODEL_PACK: buffalo_l
    environment:
      <<: *service-env
      ORT_PROVIDERS: ${ORT_PROVIDERS:-CPUExecutionProvider}
    volumes:
      - appdata:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Resolved by the *browser*, so it must be reachable from the host.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # RTSP server. With profile "sim" it loops ./samples/demo.mp4 as rtsp://mediamtx:8554/cam1.
  # Publish a host webcam to it as well (see README).
  mediamtx:
    profiles: ["sim"]
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    environment:
      MTX_PATHS_CAM1_RUNONINIT: >-
        ffmpeg -re -stream_loop -1 -i /samples/demo.mp4
        -an -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p
        -f rtsp rtsp://localhost:$$RTSP_PORT/$$MTX_PATH
      MTX_PATHS_CAM1_RUNONINITRESTART: "yes"
    volumes:
      - ./samples:/samples:ro
    ports:
      - "8554:8554"

volumes:
  pgdata:
  appdata:
  models:
